<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Triagem IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ciano: #22d3ee;
            --violeta: #8b5cf6;
            --verde: #34d399;
            --amarelo: #fbbf24;
            --vermelho: #f87171;
        }

        body {
            min-height: 100vh;
            color: #e2e8f0;
            background:
                    radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.18), transparent 45%),
                    radial-gradient(circle at 85% 90%, rgba(34, 211, 238, 0.14), transparent 45%),
                    #070b17;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                    linear-gradient(rgba(34, 211, 238, 0.07) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(34, 211, 238, 0.07) 1px, transparent 1px);
            background-size: 44px 44px;
            -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
            mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
        }

        main { position: relative; z-index: 1; }

        .logo { color: var(--ciano); filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6)); }

        .titulo {
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, var(--ciano));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .status-ponto {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--verde);
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
            animation: pulso 2s infinite;
        }

        @keyframes pulso {
            70% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .painel {
            position: relative;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.72);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: 1rem;
            box-shadow: 0 0 40px rgba(34, 211, 238, 0.08);
        }

        .painel.varrendo::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--ciano), transparent);
            animation: varredura 1.2s linear infinite;
        }

        @keyframes varredura {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        textarea.form-control {
            resize: none;
            background: rgba(2, 6, 23, 0.6);
            border-color: rgba(148, 163, 184, 0.25);
        }

        textarea.form-control:focus {
            border-color: var(--ciano);
            box-shadow: 0 0 0 0.2rem rgba(34, 211, 238, 0.18);
        }

        .botao-principal {
            border: 0;
            color: #04111f;
            font-weight: 600;
            background: linear-gradient(90deg, var(--ciano), var(--violeta));
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
        }

        .botao-principal:hover { color: #04111f; filter: brightness(1.1); }
        .botao-principal:disabled { opacity: 0.6; box-shadow: none; }

        .rotulo {
            font-size: 0.72rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .badge-categoria {
            display: inline-block;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            font-weight: 600;
            border: 1px solid;
        }

        .medidor { display: flex; gap: 6px; width: 140px; }

        .medidor .barra {
            flex: 1;
            height: 10px;
            border-radius: 4px;
            background: rgba(148, 163, 184, 0.2);
        }

        .nivel-1 .barra:nth-child(-n+1) { background: var(--verde); box-shadow: 0 0 8px var(--verde); }
        .nivel-2 .barra:nth-child(-n+2) { background: var(--amarelo); box-shadow: 0 0 8px var(--amarelo); }
        .nivel-3 .barra:nth-child(-n+3) { background: var(--vermelho); box-shadow: 0 0 8px var(--vermelho); }

        .texto-original {
            padding: 0.85rem 1rem;
            border-left: 3px solid var(--violeta);
            border-radius: 0.4rem;
            background: rgba(2, 6, 23, 0.5);
            color: #cbd5e1;
        }

        .entrada-resultado { animation: surgir 0.4s ease-out; }

        @keyframes surgir {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7 col-xl-6">

            <header class="text-center mb-4">
                <svg class="logo mb-2" width="52" height="52" viewBox="0 0 52 52" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="26" cy="26" r="6"/>
                    <circle cx="8" cy="12" r="4"/>
                    <circle cx="44" cy="12" r="4"/>
                    <circle cx="26" cy="46" r="4"/>
                    <line x1="11" y1="14" x2="21" y2="22"/>
                    <line x1="41" y1="14" x2="31" y2="22"/>
                    <line x1="26" y1="32" x2="26" y2="42"/>
                </svg>
                <h1 class="titulo display-5">Triagem IA</h1>
                <p class="text-secondary mb-2">
                    Escreva a reclamação do cliente e a IA classifica a categoria e a prioridade.
                </p>
                <span class="status"><span class="status-ponto"></span>Sistema online</span>
            </header>

            <section id="painel-entrada" class="painel">
                <div class="p-4">
                    <label for="texto" class="rotulo mb-2">Reclamação</label>
                    <textarea id="texto" class="form-control" rows="4"
                              placeholder="Ex.: Meu pedido chegou frio e faltou um item"></textarea>
                    <div class="d-flex justify-content-between align-items-center mt-3 gap-3">
                        <small class="text-secondary">Enter envia. Shift + Enter quebra a linha.</small>
                        <button id="enviar" type="button" class="btn botao-principal px-4">
                            <span id="spinner" class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
                            <span id="rotuloBotao">Classificar</span>
                        </button>
                    </div>
                </div>
            </section>

            <section id="area-resultado" class="mt-4"></section>

        </div>
    </div>
</main>

<script>
    const NIVEIS_PRIORIDADE = { BAIXA: 1, MEDIA: 2, ALTA: 3 };

    const campoTexto = document.getElementById('texto');
    const botao = document.getElementById('enviar');
    const spinner = document.getElementById('spinner');
    const rotuloBotao = document.getElementById('rotuloBotao');
    const painelEntrada = document.getElementById('painel-entrada');
    const areaResultado = document.getElementById('area-resultado');

    function criar(tag, classe, texto) {
        const elemento = document.createElement(tag);
        if (classe) elemento.className = classe;
        if (texto !== undefined) elemento.textContent = texto;
        return elemento;
    }

    function formatarCategoria(valor) {
        const texto = String(valor).replaceAll('_', ' ').toLowerCase();
        return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function formatarPrioridade(valor) {
        const texto = String(valor).toLowerCase();
        return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function formatarData(valor) {
        const data = new Date(valor);
        return isNaN(data) ? String(valor) : data.toLocaleString('pt-BR');
    }

    function matizDaCategoria(valor) {
        let soma = 0;
        for (const letra of String(valor)) soma = (soma * 31 + letra.charCodeAt(0)) % 360;
        return soma;
    }

    function criarBadgeCategoria(valor) {
        const matiz = matizDaCategoria(valor);
        const badge = criar('span', 'badge-categoria', formatarCategoria(valor));
        badge.style.color = `hsl(${matiz}, 90%, 72%)`;
        badge.style.borderColor = `hsla(${matiz}, 90%, 65%, 0.5)`;
        badge.style.background = `hsla(${matiz}, 90%, 60%, 0.12)`;
        return badge;
    }

    function criarMedidorPrioridade(valor) {
        const nivel = NIVEIS_PRIORIDADE[valor] || 0;
        const linha = criar('div', 'd-flex align-items-center gap-3');
        const medidor = criar('div', 'medidor nivel-' + nivel);
        for (let i = 0; i < 3; i++) medidor.appendChild(criar('span', 'barra'));
        linha.append(medidor, criar('span', 'fw-semibold', formatarPrioridade(valor)));
        return linha;
    }

    function criarBloco(rotulo, conteudo) {
        const bloco = criar('div', 'mb-4');
        bloco.append(criar('div', 'rotulo mb-2', rotulo), conteudo);
        return bloco;
    }

    function mostrarResultado(dados) {
        const painel = criar('div', 'painel entrada-resultado');
        const corpo = criar('div', 'p-4');

        const topo = criar('div', 'd-flex justify-content-between align-items-center mb-4');
        topo.append(
            criar('span', 'status', 'Triagem concluída'),
            criar('span', 'rotulo', 'Protocolo #' + dados.id)
        );

        corpo.append(
            topo,
            criarBloco('Categoria', criarBadgeCategoria(dados.categoria)),
            criarBloco('Prioridade', criarMedidorPrioridade(dados.prioridade)),
            criarBloco('Reclamação', criar('div', 'texto-original', dados.texto)),
            criar('div', 'rotulo', 'Registrado em ' + formatarData(dados.criadoEm))
        );

        painel.appendChild(corpo);
        areaResultado.replaceChildren(painel);
    }

    function mostrarErro(mensagem) {
        const alerta = criar('div', 'alert alert-danger border-0 mb-0 entrada-resultado', mensagem);
        areaResultado.replaceChildren(alerta);
    }

    function definirCarregando(carregando) {
        botao.disabled = carregando;
        spinner.classList.toggle('d-none', !carregando);
        rotuloBotao.textContent = carregando ? 'Analisando...' : 'Classificar';
        painelEntrada.classList.toggle('varrendo', carregando);
    }

    async function classificar() {
        const texto = campoTexto.value.trim();
        if (!texto) {
            mostrarErro('Digite a reclamação antes de classificar.');
            return;
        }

        definirCarregando(true);
        try {
            const resposta = await fetch('/triagens', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: texto })
            });
            const dados = await resposta.json();

            if (!resposta.ok) {
                mostrarErro(dados.mensagem || dados.message || 'Não foi possível classificar.');
                return;
            }
            mostrarResultado(dados);
        } catch (erro) {
            mostrarErro('Erro de conexão: ' + erro.message);
        } finally {
            definirCarregando(false);
        }
    }

    botao.addEventListener('click', classificar);

    campoTexto.addEventListener('keydown', (evento) => {
        if (evento.key === 'Enter' && !evento.shiftKey) {
            evento.preventDefault();
            classificar();
        }
    });
</script>
</body>
</html>
